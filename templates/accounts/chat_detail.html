{% extends 'base.html' %}
{% load static %}
{% load humanize %}

{% block title %}Chat - {{ property.title }}{% endblock %}

{% block body_class %}bg-gray-50{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col" style="height: calc(100vh - 200px);">
        <!-- Chat Header -->
        <div class="bg-primary-600 p-4 text-white flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <a href="{% url 'chat_list' %}" class="text-white hover:text-primary-100">
                    <i class="fas fa-arrow-left text-xl"></i>
                </a>
                <div>
                    <h2 class="text-lg font-bold">{{ other_participant_name }}</h2>
                    <p class="text-sm text-primary-100">{{ property.title }}</p>
                </div>
            </div>
            <a href="{% url 'property_detail' property.id %}" class="text-white hover:text-primary-100">
                <i class="fas fa-external-link-alt"></i>
            </a>
        </div>

        <!-- Messages Container -->
        <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <!-- Messages will be loaded here -->
            <div id="messagesLoading" class="text-center text-gray-500 py-4">
                <i class="fas fa-spinner fa-spin"></i> Loading messages...
            </div>
            <div id="messagesList" class="space-y-4 hidden">
                <!-- Messages will be inserted here -->
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="px-4 py-2 hidden">
            <div class="flex items-center space-x-2 text-gray-500 text-sm">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s;"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
                </div>
                <span id="typingUser"></span> is typing...
            </div>
        </div>

        <!-- Message Input -->
        <div class="border-t border-gray-200 p-4 bg-white">
            <form id="messageForm" class="flex items-center space-x-2">
                <input type="text" 
                       id="messageInput" 
                       placeholder="Type your message..." 
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                       autocomplete="off">
                <button type="submit" 
                        id="sendButton"
                        class="bg-primary-600 hover:bg-primary-700 text-white px-6 py-2 rounded-lg transition-colors">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/chat.js' %}"></script>
<script>
    // Initialize chat
    document.addEventListener('DOMContentLoaded', function() {
        const chatId = {{ chat.id }};
        const currentUserId = {{ user.id }};
        initChat(chatId, currentUserId);
    });
</script>
{% endblock %}
